services:
  api:
    container_name: evolution_api
    image: evolution/api:local
    build: .
    restart: always
    ports:
      - 0.0.0.0:8080:8080
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - network_swarm_public
    env_file:
      - .env
    expose:
      - 8080

volumes:
  evolution_instances:


networks:
  network_swarm_public:
    name: network_swarm_public
    driver: bridge
    external: true
